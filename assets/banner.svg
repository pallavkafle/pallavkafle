<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pallav Kafle, Computer Engineering student and full-stack developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.6" stop-color="#101a33"/>
      <stop offset="1" stop-color="#2b2a47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.65">
      <stop offset="0" stop-color="#f0b45a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    /* stars */
    .star { animation: twinkle 4s ease-in-out infinite; }
    .d1 { animation-delay: 0.8s; }
    .d2 { animation-delay: 1.7s; animation-duration: 5s; }
    .d3 { animation-delay: 2.6s; animation-duration: 3.5s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }

    /* horizon glow breathes slowly */
    .glow { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }

    /* occasional shooting star */
    .shoot { opacity: 0; animation: shoot 16s linear 3s infinite; }
    @keyframes shoot {
      0%, 88% { opacity: 0; transform: translate(0, 0); }
      90% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(220px, 88px); }
    }

    /* drifting mist */
    .mist-a { animation: drift 38s ease-in-out infinite alternate; }
    .mist-b { animation: drift 52s ease-in-out infinite alternate-reverse; }
    .mist-c { animation: drift 64s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-50px); } to { transform: translateX(50px); } }

    /* entrance */
    .rise { animation: rise 1.4s ease-out both; }
    .rise-2 { animation: rise 1.4s ease-out 0.45s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .draw { stroke-dasharray: 80; animation: draw 1.1s ease-out 0.6s both; }
    @keyframes draw { from { stroke-dashoffset: 80; } to { stroke-dashoffset: 0; } }

    .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 58px; letter-spacing: 1.5px; fill: #f3f6fb; }
    .role { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 4px; fill: #9ecbff; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .shoot { opacity: 0; } }
  </style>

  <!-- sky + horizon glow -->
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect class="glow" width="1200" height="300" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="90" cy="40" r="1.4"/>
    <circle class="star d1" cx="210" cy="85" r="1"/>
    <circle class="star d2" cx="330" cy="30" r="1.2"/>
    <circle class="star d3" cx="450" cy="70" r="0.9"/>
    <circle class="star d1" cx="560" cy="28" r="1.3"/>
    <circle class="star" cx="690" cy="62" r="1"/>
    <circle class="star d2" cx="800" cy="34" r="1.4"/>
    <circle class="star d3" cx="920" cy="78" r="1"/>
    <circle class="star" cx="1020" cy="26" r="1.2"/>
    <circle class="star d1" cx="1120" cy="66" r="1.4"/>
    <circle class="star d2" cx="150" cy="130" r="0.9"/>
    <circle class="star d3" cx="1060" cy="140" r="0.9"/>
    <circle class="star d1" cx="40" cy="95" r="0.8"/>
    <circle class="star d2" cx="1170" cy="110" r="0.8"/>
  </g>

  <!-- shooting star -->
  <g transform="translate(150 22)">
    <line class="shoot" x1="-52" y1="-21" x2="0" y2="0" stroke="url(#trail)" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- far ridge -->
  <path d="M0 232 L80 207 L160 224 L260 182 L340 217 L430 192 L520 227 L620 197 L700 222 L800 177 L900 217 L1000 192 L1100 222 L1200 202 L1200 300 L0 300 Z" fill="#1c2848"/>
  <ellipse class="mist-a" cx="320" cy="238" rx="280" ry="14" fill="#ffffff" opacity="0.06"/>

  <!-- mid ridge -->
  <path d="M0 256 L120 233 L220 251 L330 226 L450 253 L560 236 L680 259 L790 231 L910 256 L1030 237 L1130 257 L1200 246 L1200 300 L0 300 Z" fill="#131d38"/>
  <ellipse class="mist-b" cx="880" cy="258" rx="320" ry="12" fill="#ffffff" opacity="0.05"/>
  <ellipse class="mist-c" cx="560" cy="268" rx="240" ry="9" fill="#ffffff" opacity="0.04"/>

  <!-- near ridge -->
  <path d="M0 281 L150 269 L300 283 L480 267 L640 285 L820 271 L980 287 L1100 273 L1200 281 L1200 300 L0 300 Z" fill="#0a1022"/>

  <!-- text -->
  <text class="name rise" x="600" y="128" text-anchor="middle">Pallav Kafle</text>
  <line class="draw" x1="560" y1="150" x2="640" y2="150" stroke="#f0b45a" stroke-width="2" stroke-linecap="round"/>
  <text class="role rise-2" x="600" y="182" text-anchor="middle">COMPUTER ENGINEERING · FULL-STACK · APPLIED AI</text>
</svg>
