## About

Computer Engineering student at **Himalaya College of Engineering** (Tribhuvan University), based in Nepal. I build full-stack web applications with the MERN stack and Next.js, develop for Android, and I'm working toward a career as an **AI Engineer**.

I learn by shipping: small deployable projects first, then iterating on architecture, performance, and code quality.

| | |
|---|---|
| **Building** | TrailMind, our final-year project: an intelligent travel planning app for Nepal |
| **Exploring** | LLM-powered features, Kotlin and Android, ML fundamentals, software architecture |
| **Focus** | Useful products, clean code, steady engineering growth |
| **Open to** | Collaboration, open-source contributions, internships |
| **Off-screen** | Music, movies, travelling |

