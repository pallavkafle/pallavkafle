## Featured Project

### TrailMind: Intelligent Travel Planning for Nepal

A collaborative final-year engineering project (CT 707) that makes travel planning in Nepal smarter and more convenient. It is an Android application built with a team of four and currently in active development.

**Platform:** Android &nbsp;·&nbsp; **Status:** In development &nbsp;·&nbsp; **Type:** Team major project

